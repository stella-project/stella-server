name: stella-dev

networks:
  stella-shared:
    name: stella-shared
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24

services:
  server:
    build: 
      context: ./web
      dockerfile: Dockerfile.dev
    volumes:
      - ./web:/app
    expose:
      - "8000"
    ports:
      - "8000:8000"
    networks:
      stella-shared:
        aliases:
          - stella-server
    environment:
      # Config
      FLASK_APP: app/app
      FLASK_CONFIG: postgres
      SECRET_KEY: change-me
 
      ADMIN_USERNAME: admin
      ADMIN_MAIL: admin@stella-project.org
      ADMIN_PASS: pass
      SITE_USERNAME: site
      SITE_MAIL: site@stella-project.org
      SITE_PASS: pass
      EXPERIMENTER_USERNAME: experimenter
      EXPERIMENTER_MAIL: experimenter@stella-project.org
      EXPERIMENTER_PASS: pass

      # Database
      POSTGRES_USER: postgres
      POSTGRES_PW: change-me
      POSTGRES_DB: postgres
      POSTGRES_URL: db-server:5432

      # Systems (same format as SYSTEMS_CONFIG in stella-app), registered by `flask seed-db`.
      # Optional keys: "base", "precomputed", "url" (systems without a URL are built from ./systems/<name>).
      SYSTEMS_CONFIG: |
        {
          "gesis_rec_pyserini": {"type": "recommender", "url": "https://github.com/stella-project/gesis_rec_pyserini"},
          "gesis_rec_pyterrier": {"type": "recommender", "base": true, "url": "https://github.com/stella-project/gesis_rec_pyterrier"},
          "gesis_rank_pyserini": {"type": "ranker", "url": "https://github.com/stella-project/gesis_rank_pyserini"},
          "gesis_rank_pyserini_base": {"type": "ranker", "base": true, "url": "https://github.com/stella-project/gesis_rank_pyserini_base"}
        }
      STELLA_APP_ADDRESS: |
        [
          "http://stella-app:8000"
        ]



    command: flask run --host=0.0.0.0 --port=8000 --reload --debug
    depends_on:
      - db-server

  db-server:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - ./data/db-server-data:/var/lib/postgresql/data
    expose:
      - "5432"
    ports:
      - "5432:5432"
    networks:
      - stella-shared
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=change-me
      - POSTGRES_DB=postgres
  
  nginx:
    restart: always
    build: ./nginx
    ports:
      - "80:80"
      # - 443:443
    # volumes:
    #   - /etc/ssl:/etc/ssl
    #   - /etc/letsencrypt/live:/etc/letsencrypt/live
    #   - /etc/letsencrypt/archive:/etc/letsencrypt/archive
    networks:
      - stella-shared
    depends_on:
      - server